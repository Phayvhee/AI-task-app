apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-task-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Phayvhee/AI-task-app-infra.git
    targetRevision: main
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-task-platform
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # revert manual drift back to git state
    syncOptions:
      - CreateNamespace=true
  # The worker's replica count is owned by its HorizontalPodAutoscaler,
  # so Argo must not treat autoscaled replicas as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: worker
      jsonPointers:
        - /spec/replicas
