apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-task-platform
  namespace: ai-task-platform
spec:
  rules:
    - host: ai-task-platform.local
      http:
        paths:
          # API traffic goes straight to the backend. The path is preserved
          # (no rewrite) because the backend serves everything under /api.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          # Everything else is the SPA served by the frontend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
