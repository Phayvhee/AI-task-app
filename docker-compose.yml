services:
  mongodb:
    image: mongo:7.0
    container_name: ai-task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ai-task-platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-task-network

  redis:
    image: redis:7.2-alpine
    container_name: ai-task-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-task-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-task-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      PORT: 5000
      JWT_SECRET: change-me-in-production
      MONGO_URI: mongodb://admin:password@mongodb:27017/ai-task-platform?authSource=admin
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    networks:
      - ai-task-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build with an empty API base so the app uses relative /api paths,
      # which nginx proxies to the backend service (see frontend/nginx.conf).
      args:
        VITE_API_URL: ""
    container_name: ai-task-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # nginx-unprivileged listens on 8080 inside the container.
      - "5173:8080"
    networks:
      - ai-task-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ai-task-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://admin:password@mongodb:27017/ai-task-platform?authSource=admin
    volumes:
      - ./worker:/app
    networks:
      - ai-task-network
    command: python worker.py

volumes:
  mongodb_data:
  redis_data:

networks:
  ai-task-network:
    driver: bridge