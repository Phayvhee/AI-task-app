# Render Blueprint for a fully free deploy of the AI Task Platform.
services:
  - type: web
    name: ai-task-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: FRONTEND_URL
        value: https://frontend-ai-task-app.vercel.app
      - key: MONGO_URI
        sync: false                  # set in the dashboard (Atlas SRV string)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-task-redis
          property: connectionString

  - type: keyvalue
    name: ai-task-redis
    plan: free                       # in-memory only
    ipAllowList: []                  # private network access only
    maxmemoryPolicy: noeviction      # don't drop queued jobs under pressure
