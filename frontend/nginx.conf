server {
  # Unprivileged nginx listens on a non-root port.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend service. In Kubernetes the ingress
  # routes /api directly to the backend; this proxy makes the same
  # relative "/api" paths work for local docker-compose too.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
